name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check backend/app backend/tests
          ruff format --check backend/app backend/tests

      - name: Run Mypy Type Check
        run: |
          mypy backend/app

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/pos_test_db
          JWT_SECRET_KEY: ci_secret_key_minimum_32_characters_for_pytest
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing

