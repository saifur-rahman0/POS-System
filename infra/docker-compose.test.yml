services:
  test_db:
    image: postgres:16-alpine
    container_name: pos_test_db
    environment:
      POSTGRES_DB: pos_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d pos_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

